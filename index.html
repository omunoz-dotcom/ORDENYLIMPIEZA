<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f4a">
<title>Limpieza por Zonas</title>
<style>
:root{--v:#1f6f4a;--v2:#e6f4ec;--r:#c62828;--r2:#fdecea;--a:#a55f00;--a2:#fff3df;--az:#1565c0;--az2:#e8f0fb;--g:#5f6b66;--g2:#eef1ef;--b:#dde4e0;--t:#13221b;--bg:#f3f6f4}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);font-size:16px}
header{background:var(--v);color:#fff;padding:14px 16px 12px}
header .z{font-size:21px;font-weight:800;line-height:1.2}header .s{font-size:13px;opacity:.9;margin-top:3px}
main{padding:16px;max-width:560px;margin:0 auto}
.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:20px;margin:0 0 8px}h3{font-size:16px;margin:0 0 8px}p{margin:6px 0;line-height:1.45}
.muted{color:var(--g);font-size:14px}.center{text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;padding:14px;border:0;border-radius:12px;font-size:18px;font-weight:700;background:var(--v);color:#fff;margin-top:12px;cursor:pointer}
.btn.sec{background:#fff;color:var(--v);border:2px solid var(--v)}.btn:disabled{opacity:.4}
label{font-weight:600;font-size:14px;display:block;margin-top:14px}
select,input{width:100%;font-size:20px;padding:13px;border:1px solid #c9d3ce;border-radius:10px;margin-top:6px;background:#fff;color:var(--t)}
.paso{display:flex;gap:10px;align-items:center;margin:8px 0}
.paso b{width:30px;height:30px;border-radius:50%;background:var(--v2);color:var(--v);display:flex;align-items:center;justify-content:center;flex:none}
ul.lst{margin:0;padding-left:20px}ul.lst li{margin:4px 0}
.big{font-size:44px;font-weight:800;text-align:center;margin:6px 0;font-variant-numeric:tabular-nums}
.ver{border-radius:14px;padding:18px;text-align:center;margin-bottom:14px}.ver .e{font-size:26px;font-weight:800;margin-bottom:4px}
.ok{background:var(--v2);color:var(--v)}.warn{background:var(--a2);color:var(--a)}.bad{background:var(--r2);color:var(--r)}.info{background:var(--az2);color:var(--az)}.gray{background:var(--g2);color:var(--g)}
.ruta ul{list-style:none;margin:0;padding:0}.ruta li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--g2)}
.chip{font-size:13px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;border-bottom:1px solid var(--g2);text-align:left;vertical-align:top}th{color:var(--g);font-weight:600}.n{text-align:center!important;font-weight:700;width:58px}
.prev img{width:100%;border-radius:12px;display:block}
.spin{width:44px;height:44px;border:5px solid var(--v2);border-top-color:var(--v);border-radius:50%;animation:g 1s linear infinite;margin:20px auto}@keyframes g{to{transform:rotate(360deg)}}
.link{display:block;margin:14px auto 0;background:none;border:0;color:var(--v);font-weight:600;font-size:15px;text-decoration:underline}
#cam{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
#cam .vw{position:relative;flex:1;min-height:0;overflow:hidden}
#cam video{width:100%;height:100%;object-fit:cover;display:block}
#ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35;pointer-events:none}#ghost.off{display:none}
.camtop{position:absolute;top:0;left:0;right:0;padding:14px 16px 28px;background:linear-gradient(#000b,#0000);color:#fff;font-weight:700;font-size:17px}.camtop small{display:block;font-weight:400;font-size:13px;opacity:.9;margin-top:3px}
.cambar{display:flex;justify-content:space-around;align-items:center;padding:18px 0 calc(18px + env(safe-area-inset-bottom));background:#000}
.shot{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:#ffffff33}.shot:active{background:#fff}
.cb{width:70px;height:48px;border-radius:10px;border:1px solid #ffffff66;background:transparent;color:#fff;font-size:15px}
</style>
</head>
<body>
<header><div class="z" id="hz">Control de Limpieza</div><div class="s" id="hs">Bodega de Silos</div></header>
<main id="app"></main>

<script>
/* ====== CONFIGURACIÓN ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwLvTzQNR-mZcWK4SXRv0iBUqidTbHhnZSSsC8iAAhdxlXr8R4XYP2zNU6BvUSDwb5U/exec';   // termina en /exec

/* ====== ESTADO Y UTILIDADES ====== */
const S = {};
let timer = null, stream = null;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ESTADOS = {
  PENDIENTE:['⏳ Pendiente','gray'], EN_PROCESO:['🧹 En limpieza','info'], ANALIZANDO:['🔎 Analizando','info'],
  OBSERVADO:['⚠️ Corregir','warn'], REHACER:['❌ Rehacer','bad'], REVISION_JEFE:['👁 Revisión jefe','info'],
  APROBADO:['✅ Aprobado','ok'], ANULADO:['❌ Anulado','bad']
};
const est = e => ESTADOS[e] || [e, 'gray'];
function ahoraSrv(){ return new Date(Date.now() + (S.off || 0)); }
function fh(ms, conFecha){
  return new Date(ms).toLocaleString('es-EC', Object.assign({timeZone:'America/Guayaquil',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false},
    conFecha ? {day:'2-digit',month:'2-digit',year:'numeric'} : {}));
}
function ls(k, v){
  try{
    if(v === undefined) return JSON.parse(localStorage.getItem(k) || 'null');
    if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v));
  }catch(e){ return null; }
}
async function api(body){
  const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || 'Error del servidor');
  return j;
}
function pantalla(html){ clearInterval(timer); $('#app').innerHTML = html; window.scrollTo(0,0); }
function cargando(t){ pantalla(`<div class="card center"><div class="spin"></div><p>${esc(t)}</p></div>`); }
function error(msg){ pantalla(`<div class="ver bad"><div class="e">⚠️</div><p>${esc(msg)}</p></div><button class="btn" onclick="refrescar()">Volver</button>`); }

/* ====== CARGA DE ZONA ====== */
async function refrescar(){
  const p = new URLSearchParams(location.search);
  S.z = p.get('z'); S.t = p.get('t');
  if(!S.z || !S.t) return pantalla(`<div class="card center"><h2>Escanee el código QR de la zona</h2><p class="muted">Apunte la cámara del celular al código QR pegado en la zona de limpieza.</p></div>`);
  cargando('Cargando zona…');
  try{
    const t0 = Date.now();
    const r = await api({accion:'init', z:S.z, t:S.t});
    S.off = r.servidor - Math.round((t0 + Date.now()) / 2);       // hora oficial = hora del servidor
    Object.assign(S, {zona:r.zona, turno:r.turno, ops:r.operadores, geo:r.geocerca, ez:r.estadoZona, ruta:r.ruta,
      ventana:r.ventana, enVentana:r.enVentana, bloqueo:r.bloqueaFueraVentana, vigencia:r.minFotoVigencia});
    S.turnoKey = r.turno.fecha + '_' + r.turno.turno;
    $('#hz').textContent = r.zona.nombre;
    $('#hs').textContent = 'Turno ' + (r.turno.turno === 'DIA' ? 'Día' : 'Noche') + ' · Ruta de ' + r.ventana;
    const g = ls('lim_op');
    if(g && g.turnoKey === S.turnoKey){ S.op = g; return decidir(); }
    login();
  }catch(e){ error(e.message); }
}

function login(){
  const prog = S.ops.filter(o => o.programado), otros = S.ops.filter(o => !o.programado);
  const opt = l => l.map(o => `<option value="${esc(o.id)}">${esc(o.nombre)}</option>`).join('');
  pantalla(`<div class="card"><h2>Identifíquese</h2><p class="muted">Solo una vez por turno.</p>
    <label>Operador</label>
    <select id="op"><option value="">— Seleccione su nombre —</option>
      ${prog.length ? `<optgroup label="Programados en este turno">${opt(prog)}</optgroup>` : ''}
      ${otros.length ? `<optgroup label="${prog.length ? 'Otros (reemplazo)' : 'Operadores'}">${opt(otros)}</optgroup>` : ''}
    </select>
    <label>PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8">
    <button class="btn" id="bi">Ingresar</button></div>`);
  $('#bi').onclick = async () => {
    const id = $('#op').value, pin = $('#pin').value.trim();
    if(!id || !pin) return alert('Seleccione su nombre e ingrese su PIN.');
    $('#bi').disabled = true;
    try{
      const r = await api({accion:'login', op:id, pin});
      S.op = {id, pin, nombre:r.nombre, turnoKey:S.turnoKey};
      ls('lim_op', S.op);
      decidir();
    }catch(e){ alert(e.message); $('#bi').disabled = false; }
  };
}
function salir(){ ls('lim_op', null); S.op = null; login(); }

/* ====== FLUJO PRINCIPAL ====== */
function decidir(){
  const ez = S.ez || {estado:'PENDIENTE'}, reg = ez.reg;
  const pie = rutaHtml() + `<button class="link" onclick="salir()">No soy ${esc(S.op.nombre)} · cambiar operador</button>`;
  if(ez.estado === 'APROBADO')
    return pantalla(`<div class="ver ok"><div class="e">✅ Zona aprobada</div><p>Limpiada por ${esc(reg.operador)} · ${fh(reg.horaDespues)}</p></div>${pie}`);
  if(reg && ['EN_PROCESO','ANALIZANDO','OBSERVADO','REHACER','REVISION_JEFE'].includes(ez.estado)){
    if(reg.operadorId !== S.op.id)
      return pantalla(`<div class="ver info"><div class="e">🧹 En curso</div><p>Esta limpieza la inició <b>${esc(reg.operador)}</b>. Solo esa persona puede cerrarla.</p></div>${pie}`);
    if(ez.estado === 'EN_PROCESO') return pasoDespues(reg, pie);
    if(ez.estado === 'ANALIZANDO' || ez.estado === 'REVISION_JEFE')
      return pantalla(`<div class="ver info"><div class="e">👁 En revisión</div><p>${ez.estado === 'ANALIZANDO' ? 'La IA está analizando las fotos. Actualice en un momento.' : 'El jefe revisará las fotos de esta limpieza.'}</p></div>
        <button class="btn sec" onclick="refrescar()">↻ Actualizar</button>${pie}`);
    return pantalla(resultadoHtml(reg) + `<button class="btn" onclick="tomar('DESPUES')">📷 Corregí · tomar nueva foto DESPUÉS</button>` + pie);
  }
  pasoAntes(pie);
}

function criteriosHtml(){ return `<h3 style="margin-top:14px">La zona debe quedar con:</h3><ul class="lst">${S.zona.criterios.map(c => `<li>${esc(c)}</li>`).join('')}</ul>`; }

function pasoAntes(pie){
  const bloq = S.bloqueo && !S.enVentana;
  pantalla(`<div class="card"><h2>Ruta de limpieza</h2>
    <div class="paso"><b>1</b>Tome la foto ANTES</div>
    <div class="paso"><b>2</b>Limpie la zona completa (mínimo ${S.zona.tiempoMin} min)</div>
    <div class="paso"><b>3</b>Tome la foto DESPUÉS desde el mismo punto</div>
    ${S.zona.instruccion ? `<p class="muted">📍 ${esc(S.zona.instruccion)}</p>` : ''}
    ${criteriosHtml()}
    ${bloq ? `<div class="ver warn" style="margin:14px 0 0"><b>Fuera de horario</b><p>La ruta de este turno se registra de ${esc(S.ventana)}.</p></div>` : ''}
    <button class="btn" ${bloq ? 'disabled' : ''} onclick="tomar('ANTES')">📷 Tomar foto ANTES</button></div>${pie}`);
}

function pasoDespues(reg, pie){
  const listo = reg.horaAntes + S.zona.tiempoMin * 60000;
  pantalla(`<div class="ver info"><div class="e">🧹 Limpie la zona</div><p>Foto ANTES registrada a las ${fh(reg.horaAntes)}</p></div>
    <div class="card"><p class="center muted" id="lbl">Podrá tomar la foto DESPUÉS en:</p><div class="big" id="cd">--:--</div>
    ${criteriosHtml()}
    <button class="btn" id="bd" disabled onclick="tomar('DESPUES')">📷 Tomar foto DESPUÉS</button></div>${pie}`);
  const tick = () => {
    const f = listo - ahoraSrv().getTime();
    if(f <= 0){ $('#cd').textContent = '✓'; $('#lbl').textContent = 'Ya puede tomar la foto DESPUÉS'; $('#bd').disabled = false; clearInterval(timer); return; }
    $('#cd').textContent = Math.floor(f / 60000) + ':' + String(Math.floor(f % 60000 / 1000)).padStart(2, '0');
  };
  tick(); timer = setInterval(tick, 1000);
}

function rutaHtml(){
  const r = S.ruta; if(!r) return '';
  return `<div class="card ruta"><h3>Ruta del turno: ${r.aprobadas}/${r.total} zonas aprobadas</h3><ul>
    ${r.zonas.map(z => { const [t, c] = est(z.estado); return `<li><span>${esc(z.nombre)}</span><span class="chip ${c}">${t}</span></li>`; }).join('')}
    </ul>${r.total && r.aprobadas === r.total ? '<p class="center" style="color:var(--v);font-weight:800;margin-top:10px">🎉 Ruta completa</p>' : ''}</div>`;
}

function resultadoHtml(x){
  const [t, c] = est(x.estado);
  const col = d => d >= 4 ? 'var(--v)' : d <= 2 ? 'var(--r)' : 'var(--a)';
  const crit = (x.criterios || []).map(k => `<tr><td>${esc(k.criterio)}</td><td class="n">${esc(k.antes)}</td><td class="n" style="color:${col(k.despues)}">${esc(k.despues)}</td></tr>`).join('');
  return `<div class="ver ${c}"><div class="e">${t}</div><p>${esc(x.motivo || '')}</p>
      ${x.sd !== '' && x.sd != null ? `<p style="font-size:18px"><b>${esc(x.sa)} → ${esc(x.sd)}</b> de 5</p>` : ''}</div>
    ${(x.hallazgos || []).length ? `<div class="card"><h3>Lo que falta corregir</h3><ul class="lst">${x.hallazgos.map(h => `<li>${esc(h)}</li>`).join('')}</ul></div>` : ''}
    ${crit ? `<div class="card"><h3>Calificación por criterio</h3><table><tr><th>Criterio</th><th class="n">Antes</th><th class="n">Después</th></tr>${crit}</table></div>` : ''}`;
}

/* ====== FOTOS ====== */
async function tomar(tipo){
  const foto = await abrirCamara(tipo);
  if(!foto) return decidir();
  pantalla(`<div class="card prev"><h3>Foto ${tipo === 'ANTES' ? 'ANTES' : 'DESPUÉS'}</h3><img src="${foto.b64}" alt="">
    <button class="btn" id="be">✔ Enviar foto</button><button class="btn sec" id="br">↺ Repetir</button></div>`);
  $('#br').onclick = () => tomar(tipo);
  $('#be').onclick = async () => {
    if(ahoraSrv().getTime() - foto.hora > (S.vigencia || 5) * 60000) return error('La foto venció. Tómela de nuevo en el momento.');
    cargando(tipo === 'ANTES' ? 'Registrando foto ANTES…' : 'Analizando la limpieza con IA… (puede tardar unos 20 segundos)');
    try{
      const base = Object.assign({op:S.op.id, pin:S.op.pin, foto:foto.b64}, await ubicacion());
      if(tipo === 'ANTES'){ await api(Object.assign(base, {accion:'antes', z:S.z, t:S.t})); return refrescar(); }
      const r = await api(Object.assign(base, {accion:'despues', id:S.ez.reg.id}));
      pantalla(resultadoHtml(r) + `<button class="btn" onclick="refrescar()">Continuar</button>`);
    }catch(e){ error(e.message); }
  };
}

async function abrirCamara(tipo){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ error('Este navegador no permite usar la cámara. Abra el enlace en Google Chrome.'); return null; }
  const ov = document.createElement('div'); ov.id = 'cam';
  ov.innerHTML = `<div class="vw"><video id="vid" autoplay playsinline muted></video>
      ${S.zona.refUrl ? `<img id="ghost" src="${esc(S.zona.refUrl)}" referrerpolicy="no-referrer" alt="">` : ''}
      <div class="camtop">FOTO ${tipo === 'ANTES' ? 'ANTES' : 'DESPUÉS'} · ${esc(S.zona.nombre)}<small>${esc(S.zona.instruccion || 'Encuadre la zona completa')}${S.zona.refUrl ? ' · Haga coincidir con la guía' : ''}</small></div></div>
    <div class="cambar"><button class="cb" id="cx">Cancelar</button><button class="shot" id="cs" aria-label="Tomar foto"></button><button class="cb" id="cg">${S.zona.refUrl ? 'Guía' : ''}</button></div>`;
  document.body.appendChild(ov);
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}}, audio:false});
    $('#vid').srcObject = stream;
  }catch(e){ cerrarCam(); error('No se pudo abrir la cámara. Permita el acceso a la cámara para esta página y vuelva a intentar.'); return null; }
  return new Promise(res => {
    $('#cx').onclick = () => { cerrarCam(); res(null); };
    const g = $('#ghost'); if(g) $('#cg').onclick = () => g.classList.toggle('off');
    $('#cs').onclick = () => {
      const v = $('#vid'); if(!v.videoWidth) return;
      const data = capturar(v, tipo); cerrarCam(); res(data);
    };
  });
}
function cerrarCam(){ if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } const c = $('#cam'); if(c) c.remove(); }

function capturar(v, tipo){
  const W = Math.min(1280, v.videoWidth), Hh = Math.round(v.videoHeight * W / v.videoWidth);
  const c = document.createElement('canvas'); c.width = W; c.height = Hh;
  const x = c.getContext('2d'); x.drawImage(v, 0, 0, W, Hh);
  const hora = ahoraSrv(), fs = Math.max(16, Math.round(W / 42)), band = Math.round(fs * 3.4);
  x.fillStyle = 'rgba(0,0,0,.62)'; x.fillRect(0, Hh - band, W, band);
  x.fillStyle = '#fff'; x.font = `700 ${fs}px sans-serif`;
  x.fillText(`${tipo === 'ANTES' ? 'ANTES' : 'DESPUÉS'} · ${S.zona.nombre}`, fs * .6, Hh - band + fs * 1.3);
  x.font = `${Math.round(fs * .85)}px sans-serif`;
  x.fillText(`${fh(hora.getTime(), true)} · ${S.op.nombre}`, fs * .6, Hh - band + fs * 2.75);
  return {b64: c.toDataURL('image/jpeg', 0.75), hora: hora.getTime()};
}

function ubicacion(){
  if(!S.geo || !navigator.geolocation) return Promise.resolve({});
  return new Promise(res => navigator.geolocation.getCurrentPosition(
    p => res({lat:p.coords.latitude, lng:p.coords.longitude}), () => res({}), {enableHighAccuracy:true, timeout:10000}));
}

refrescar();
</script>
</body>
</html>
