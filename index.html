<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f4a">
<title>Limpieza</title>
<style>
:root{--v:#1f6f4a;--v2:#e6f4ec;--r:#c62828;--r2:#fdecea;--g:#5f6b66;--g2:#eef1ef;--b:#dde4e0;--t:#13221b;--bg:#f3f6f4}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);font-size:17px}
header{background:var(--v);color:#fff;padding:14px 16px}
header b{font-size:20px;display:block}header small{opacity:.9;font-size:14px}
main{padding:16px;max-width:520px;margin:0 auto}
.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:14px}
label{font-weight:700;font-size:14px;display:block;margin:12px 0 6px}
select,input{width:100%;font-size:19px;padding:13px;border:1px solid #c9d3ce;border-radius:10px;background:#fff;color:var(--t)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:62px;border:0;border-radius:12px;font-size:19px;font-weight:800;background:var(--v);color:#fff;margin-top:14px;cursor:pointer}
.btn.sec{background:#fff;color:var(--v);border:2px solid var(--v)}.btn:disabled{opacity:.35}
.paso{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.paso i{font-style:normal;width:32px;height:32px;border-radius:50%;background:var(--v2);color:var(--v);display:flex;align-items:center;justify-content:center}
.paso.ok i{background:var(--v);color:#fff}
.foto{width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-top:12px;display:block}
.estado{margin-top:10px;font-size:15px;color:var(--g)}
.ok-txt{color:var(--v);font-weight:700}.mal{color:var(--r);font-weight:700}
.fin{background:var(--v2);border-color:#b9dcc8;text-align:center}
.fin h2{color:var(--v);margin:6px 0}
.muted{color:var(--g);font-size:14px}
.link{background:none;border:0;color:var(--v);text-decoration:underline;font-size:15px;margin-top:10px;padding:6px 0}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
input[type=file]{display:none}
</style>
</head>
<body>
<header><b id="titulo">🧹 Control de Limpieza</b><small id="sub">Foto antes y después</small></header>
<main id="app"></main>
<input type="file" id="cam" accept="image/*" capture="environment">

<script>
/* ====== ÚNICA CONFIGURACIÓN: pegue aquí la URL /exec de su Apps Script ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbz4P5Ox7MM7YcV6qsmSr8dcFMULuS2WHlCHSVw2DTPjf7RVIcg5Or7227NwSC0pC3qmIQ/exec';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ls(k, v){ try{ if(v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
const hoy = () => new Date().toLocaleDateString('en-CA', {timeZone:'America/Guayaquil'});
const hora = () => new Date().toLocaleTimeString('es-EC', {timeZone:'America/Guayaquil', hour:'2-digit', minute:'2-digit', hour12:false});

// Estado: listas (en caché para abrir al instante), usuario recordado y limpieza en curso
const zonaQR = new URLSearchParams(location.search).get('z') || '';
let L = ls('lista') || {zonas: [], operadores: []};
let U = ls('usuario');            // {nombre, pin}
let P = ls('pendiente');          // {id, zona, hora, mini, fecha}
if(P && P.fecha !== hoy() && P.fecha !== new Date(Date.now() - 864e5).toLocaleDateString('en-CA', {timeZone:'America/Guayaquil'})) { P = null; ls('pendiente', null); }
let zona = zonaQR || (P && P.zona) || ls('ultimaZona') || '';
let fin = null, ocupado = false;

async function api(body){
  let r;
  try{ r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)}); }
  catch(e){ throw new Error('Sin conexión. Revise el internet e intente de nuevo.'); }
  let j; try{ j = await r.json(); }catch(e){ throw new Error('El servidor no respondió bien. Avise al jefe.'); }
  if(!j.ok) throw new Error(j.error || 'Error');
  return j;
}
// Las listas se actualizan en segundo plano; la pantalla no espera
fetch(API_URL).then(r => r.json()).then(j => { if(j.ok){ L = {zonas: j.zonas, operadores: j.operadores}; ls('lista', L); if(!ocupado) pintar(); } }).catch(() => {});

/* ====== PANTALLAS ====== */
function pintar(){
  $('#sub').textContent = U ? '👤 ' + U.nombre : 'Foto antes y después';
  if(!U) return pintarLogin();
  if(fin) return pintarFin();
  const opZ = L.zonas.map(z => `<option ${z === zona ? 'selected' : ''}>${esc(z)}</option>`).join('');
  $('#app').innerHTML = `
    <div class="card">
      ${zonaQR ? `<label>Zona</label><div style="font-size:22px;font-weight:800">📍 ${esc(zonaQR)}</div>`
        : `<label>Zona</label><select id="zona" ${P ? 'disabled' : ''}><option value="">— Elija la zona —</option>${opZ}${zona && !L.zonas.includes(zona) ? `<option selected>${esc(zona)}</option>` : ''}</select>`}
    </div>
    <div class="card">
      <div class="paso ${P ? 'ok' : ''}"><i>${P ? '✓' : '1'}</i> Foto ANTES</div>
      ${P ? `<img class="foto" src="${P.mini}" alt=""><div class="estado ok-txt">✓ Enviada a las ${esc(P.hora)}</div>`
          : `<button class="btn" id="bAntes">📷 Tomar foto ANTES</button>`}
    </div>
    <div class="card">
      <div class="paso"><i>2</i> Foto DESPUÉS</div>
      <p class="muted">${P ? 'Cuando termine de limpiar, tome la foto desde el mismo lugar.' : 'Primero tome la foto ANTES.'}</p>
      <button class="btn" id="bDespues" ${P ? '' : 'disabled'}>📷 Tomar foto DESPUÉS</button>
    </div>
    ${P ? `<button class="link" id="bCancelar">Cancelar esta limpieza</button><br>` : ''}
    <button class="link" id="bSalir">Cambiar usuario</button>`;
  const sz = $('#zona'); if(sz) sz.onchange = () => { zona = sz.value; ls('ultimaZona', zona); };
  if($('#bAntes')) $('#bAntes').onclick = () => { if(!zona) return alert('Elija la zona primero.'); tomar('antes'); };
  $('#bDespues').onclick = () => tomar('despues');
  if($('#bCancelar')) $('#bCancelar').onclick = () => { if(confirm('¿Cancelar esta limpieza? Deberá tomar de nuevo la foto ANTES.')){ P = null; ls('pendiente', null); pintar(); } };
  $('#bSalir').onclick = () => { if(P && !confirm('Hay una limpieza sin terminar. ¿Cambiar de usuario igual?')) return; U = null; ls('usuario', null); pintar(); };
}

function pintarLogin(msg){
  const op = L.operadores.map(o => `<option>${esc(o)}</option>`).join('');
  $('#app').innerHTML = `<div class="card"><h2 style="margin:0 0 4px">Ingresar</h2><p class="muted">Solo la primera vez en este celular.</p>
    <label>Usuario</label>
    ${L.operadores.length ? `<select id="u"><option value="">— Su nombre —</option>${op}</select>` : `<input id="u" placeholder="Su nombre como está en la hoja">`}
    <label>PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    ${msg ? `<p class="mal">${esc(msg)}</p>` : ''}
    <button class="btn" id="bIn">Ingresar</button></div>`;
  $('#bIn').onclick = async () => {
    const nombre = $('#u').value.trim(), pin = $('#pin').value.trim();
    if(!nombre || !pin) return alert('Escriba su usuario y PIN.');
    $('#bIn').disabled = true; $('#bIn').innerHTML = '<span class="spin"></span> Verificando…';
    try{ await api({accion:'login', operador:nombre, pin}); U = {nombre, pin}; ls('usuario', U); pintar(); }
    catch(e){ pintarLogin(e.message); }
  };
}

function pintarFin(){
  $('#app').innerHTML = `<div class="card fin"><div style="font-size:48px">✅</div><h2>Limpieza registrada</h2>
      <p>${esc(fin.zona)}<br>Antes ${esc(fin.antes)} · Después ${esc(fin.despues)}${fin.minutos !== '' ? ' · ' + fin.minutos + ' min' : ''}</p></div>
    <button class="btn" id="bNueva">Registrar otra zona</button>`;
  $('#bNueva').onclick = () => { fin = null; if(!zonaQR) zona = ''; pintar(); };
}

/* ====== FOTOS ====== */
function tomar(tipo){
  const inp = $('#cam'); inp.value = '';
  inp.onchange = async () => {
    const file = inp.files[0]; if(!file) return;
    ocupado = true;
    const b = $(tipo === 'antes' ? '#bAntes' : '#bDespues');
    b.disabled = true; b.innerHTML = '<span class="spin"></span> Enviando foto…';
    try{
      const z = tipo === 'antes' ? (zonaQR || zona) : P.zona;
      const foto = await preparar(file, tipo === 'antes' ? 'ANTES' : 'DESPUÉS', z);
      if(tipo === 'antes'){
        const r = await api({accion:'antes', zona:z, operador:U.nombre, pin:U.pin, foto:foto.grande});
        P = {id:r.id, zona:z, hora:r.hora, mini:foto.mini, fecha:hoy()}; ls('pendiente', P);
      }else{
        const r = await api({accion:'despues', id:P.id, operador:U.nombre, pin:U.pin, foto:foto.grande});
        fin = {zona:P.zona, antes:P.hora, despues:r.hora, minutos:r.minutos};
        P = null; ls('pendiente', null);
      }
    }catch(e){
      alert(e.message);
      if(/PIN|Usuario/.test(e.message)){ U = null; ls('usuario', null); }
    }
    ocupado = false; pintar();
  };
  inp.click();
}

// Reduce la foto y le pone zona, usuario, fecha y hora
function preparar(file, tipo, z){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const W = Math.round(img.width * k), H = Math.round(img.height * k);
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, W, H);
      const fs = Math.max(16, Math.round(W / 34)), band = Math.round(fs * 3.3);
      x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(0, H - band, W, band);
      x.fillStyle = '#fff'; x.font = `700 ${fs}px sans-serif`;
      x.fillText(`${tipo} · ${z}`, fs * .6, H - band + fs * 1.3);
      x.font = `${Math.round(fs * .85)}px sans-serif`;
      x.fillText(`${new Date().toLocaleDateString('es-EC', {timeZone:'America/Guayaquil'})} ${hora()} · ${U.nombre}`, fs * .6, H - band + fs * 2.7);
      URL.revokeObjectURL(url);
      const grande = c.toDataURL('image/jpeg', 0.72);
      const m = document.createElement('canvas'), km = 480 / W; m.width = 480; m.height = Math.round(H * km);
      m.getContext('2d').drawImage(c, 0, 0, m.width, m.height);
      res({grande, mini: m.toDataURL('image/jpeg', 0.6)});
    };
    img.onerror = () => rej(new Error('No se pudo leer la foto'));
    img.src = url;
  });
}

pintar();
</script>
</body>
</html>
