<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e3d">
<meta name="robots" content="noindex">
<title>Panel del Jefe - Limpieza</title>
<style>
:root{--v:#1f6f4a;--v2:#e6f4ec;--a:#a55f00;--a2:#fff3df;--r:#c62828;--r2:#fdecea;--g:#5f6b66;--g2:#eef1ef;--b:#dde4e0;--t:#13221b;--bg:#f3f6f4}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);font-size:15px}
header{background:#1f4e3d;color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1 button{white-space:nowrap;background:none;border:1px solid #ffffff66;color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{flex:none;background:none;border:0;color:#ffffffaa;padding:10px 14px;font-size:14px;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:#fff;border-bottom-color:#e8c547}
main{padding:16px;max-width:960px;margin:0 auto}
.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:0}
.muted{color:var(--g);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font-size:15px;padding:9px 10px;border:1px solid #c9d3ce;border-radius:8px;background:#fff;color:var(--t)}
.btn{border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;background:var(--v);color:#fff;cursor:pointer}
.btn.sec{background:#fff;color:var(--v);border:1.5px solid var(--v)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.kpi>div{background:#fff;border:1px solid var(--b);border-radius:12px;padding:12px;text-align:center}
.kpi b{display:block;font-size:26px}.kpi span{font-size:12px;color:var(--g);text-transform:uppercase;letter-spacing:.4px}
.barra{height:10px;background:var(--g2);border-radius:6px;overflow:hidden;margin-top:8px}.barra i{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--g2);text-align:left;vertical-align:middle}
th{color:var(--g);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.est{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.LIMPIA{background:var(--v2);color:var(--v)}.PROCESO{background:var(--a2);color:var(--a)}.PENDIENTE{background:var(--r2);color:var(--r)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fotos a{position:relative;display:block;border-radius:8px;overflow:hidden;background:var(--g2);aspect-ratio:3/4}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
.fotos span{position:absolute;left:0;right:0;bottom:0;background:#000b;color:#fff;font-size:11px;font-weight:700;padding:4px 6px}
.vacio{display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--g2);color:var(--g);font-size:13px;aspect-ratio:3/4}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px;margin-top:10px}
.dias div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--g)}
.dias i{display:block;width:70%;border-radius:4px 4px 0 0;min-height:2px}
.dias b{font-size:12px;color:var(--t)}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.qrc{background:#fff;border:1px solid var(--b);border-radius:12px;padding:14px;text-align:center}
.qrc .q{display:flex;justify-content:center;margin:10px 0}
.qrc label{display:flex;gap:6px;align-items:center;justify-content:center;font-size:13px;color:var(--g)}
.err{color:var(--r);font-weight:600}
.cargando{text-align:center;color:var(--g);padding:30px}
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}header,main{display:none!important}#print{display:block}
  .hoja{width:48%;display:inline-block;vertical-align:top;margin:0 1% 12mm;border:2px solid #1f4e3d;border-radius:10px;padding:14px;text-align:center;page-break-inside:avoid;font-family:Arial,sans-serif}
  .hoja .t{background:#1f4e3d;color:#fff;font-weight:700;font-size:12px;letter-spacing:1px;padding:6px;border-radius:6px}
  .hoja .z{font-size:22px;font-weight:800;margin:10px 0 4px}
  .hoja .q{display:flex;justify-content:center;margin:8px 0}
  .hoja ol{text-align:left;font-size:12px;margin:8px 0 0 18px;padding:0;line-height:1.5}
  .hoja .pie{font-size:10px;color:#666;margin-top:8px}
}
</style>
</head>
<body>
<header>
  <h1><span>Panel del Jefe</span><span style="display:flex;gap:6px"><button id="bAct">Actualizar</button> <button id="bSalir">Salir</button></span></h1>
  <nav id="nav"></nav>
</header>
<main id="app"><div class="cargando">Cargando…</div></main>
<div id="print"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ====== ÚNICA CONFIGURACIÓN: la misma URL /exec que usa index.html ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbz4P5Ox7MM7YcV6qsmSr8dcFMULuS2WHlCHSVw2DTPjf7RVIcg5Or7227NwSC0pC3qmIQ/exec';

// Dirección de la página del operador (misma carpeta que este panel): se usa para los QR
const URL_OPERADOR = location.href.split(/[?#]/)[0].replace(/[^/]*$/, '') + 'index.html';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ls(k, v){ try{ if(v === undefined) return localStorage.getItem(k); if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){ return null; } }
const fmtF = f => { const p = String(f).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : f; };
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const color = p => p >= 90 ? 'var(--v)' : p >= 60 ? 'var(--a)' : 'var(--r)';

let clave = ls('jefe_clave'), D = null, tab = 'avance', fecha = '', turno = 'TODOS';

async function cargar(){
  $('#app').innerHTML = '<div class="cargando">Cargando…</div>';
  try{
    const r = await fetch(API_URL + '?accion=panel&clave=' + encodeURIComponent(clave) + (fecha ? '&fecha=' + fecha : '') + '&t=' + Date.now());
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || 'Error');
    D = j; fecha = j.fecha; render();
  }catch(e){
    if(/clave/i.test(e.message)){ clave = null; ls('jefe_clave', null); return login('Clave incorrecta'); }
    $('#app').innerHTML = `<div class="card err">No se pudo cargar: ${esc(e.message)}</div>`;
  }
}

function login(msg){
  $('#nav').innerHTML = '';
  $('#app').innerHTML = `<div class="card" style="max-width:360px;margin:40px auto"><h2>Ingreso del jefe</h2>
    <p class="muted">Clave definida en la hoja CONFIG, celda B1.</p>
    <input id="cl" type="password" inputmode="numeric" style="width:100%;font-size:18px;padding:12px">
    ${msg ? `<p class="err">${esc(msg)}</p>` : ''}
    <button class="btn" id="bl" style="width:100%;margin-top:12px">Ingresar</button></div>`;
  $('#bl').onclick = () => { clave = $('#cl').value.trim(); if(!clave) return; ls('jefe_clave', clave); cargar(); };
}

function render(){
  $('#nav').innerHTML = [['avance','Avance del día'],['fotos','Fotos'],['qr','Códigos QR']]
    .map(([k, t]) => `<button class="${k === tab ? 'on' : ''}" data-t="${k}">${t}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  $('#app').innerHTML = {avance: vAvance, fotos: vFotos, qr: vQR}[tab]();
  const f = $('#fecha'); if(f) f.onchange = () => { fecha = f.value; cargar(); };
  const t = $('#turno'); if(t) t.onchange = () => { turno = t.value; render(); };
  if(tab === 'qr') pintarQR();
}

function filtros(){
  return `<div class="card filtros">
    <label class="muted">Fecha <input type="date" id="fecha" value="${esc(fecha)}" max="${esc(D.hoy)}"></label>
    <label class="muted">Turno <select id="turno">${[['TODOS','Todos'],['DIA','Día (08:00-20:00)'],['NOCHE','Noche (20:00-08:00)']].map(([v, t]) => `<option value="${v}" ${turno === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
    ${fecha !== D.hoy ? '<span class="muted">Viendo un día anterior</span>' : ''}</div>`;
}
function delTurno(){ return D.registros.filter(r => turno === 'TODOS' || r.turno === turno); }
function estadoZona(z){
  const rs = delTurno().filter(r => r.zona === z);
  const comp = rs.filter(r => r.estado === 'COMPLETA');
  if(comp.length) return {cls:'LIMPIA', txt:'Limpia', r: comp[comp.length - 1], n: comp.length};
  if(rs.length) return {cls:'PROCESO', txt:'En proceso', r: rs[rs.length - 1], n: 0};
  return {cls:'PENDIENTE', txt:'Pendiente', r: null, n: 0};
}

/* ====== AVANCE ====== */
function vAvance(){
  const est = D.zonas.map(z => Object.assign({zona: z}, estadoZona(z)));
  const limpias = est.filter(e => e.cls === 'LIMPIA').length, proc = est.filter(e => e.cls === 'PROCESO').length;
  const pct = D.zonas.length ? Math.round(limpias * 100 / D.zonas.length) : 0;
  const maxH = 100;
  return filtros() + `
    <div class="kpi">
      <div><b style="color:${color(pct)}">${pct}%</b><span>Cumplimiento</span><div class="barra"><i style="width:${pct}%;background:${color(pct)}"></i></div></div>
      <div><b>${limpias}/${D.zonas.length}</b><span>Zonas limpias</span></div>
      <div><b style="color:${proc ? 'var(--a)' : 'inherit'}">${proc}</b><span>En proceso</span></div>
    </div>
    <div class="card"><h2>Estado por zona · ${fmtF(fecha)}${turno !== 'TODOS' ? ' · Turno ' + (turno === 'DIA' ? 'Día' : 'Noche') : ''}</h2>
      <div style="overflow-x:auto"><table>
        <tr><th>Zona</th><th>Estado</th><th>Operador</th><th>Antes</th><th>Después</th><th>Min.</th></tr>
        ${est.map(e => `<tr><td><b>${esc(e.zona)}</b></td><td><span class="est ${e.cls}">${e.txt}</span>${e.n > 1 ? ` <span class="muted">x${e.n}</span>` : ''}</td>
          <td>${e.r ? esc(e.r.operador) : '—'}</td><td>${e.r ? esc(e.r.horaAntes) : '—'}</td><td>${e.r && e.r.horaDespues ? esc(e.r.horaDespues) : '—'}</td><td>${e.r && e.r.minutos ? esc(e.r.minutos) : '—'}</td></tr>`).join('')}
      </table></div></div>
    <div class="card"><h2>Cumplimiento últimos 7 días</h2><p class="muted">Porcentaje de zonas con al menos una limpieza completa en el día (ambos turnos).</p>
      <div class="dias">${D.dias.map(d => { const dt = new Date(d.fecha + 'T12:00:00-05:00');
        return `<div title="${d.limpias}/${d.total}"><b>${d.pct}%</b><i style="height:${Math.max(2, d.pct / 100 * maxH)}%;background:${color(d.pct)}"></i>${DIAS[dt.getUTCDay()]} ${d.fecha.slice(8)}</div>`; }).join('')}</div></div>`;
}

/* ====== FOTOS ====== */
function vFotos(){
  const rs = delTurno().slice().reverse();
  return filtros() + (rs.length ? `<div class="grid">${rs.map(r => `<div class="card">
      <div class="row"><h3>${esc(r.zona)}</h3><span class="est ${r.estado === 'COMPLETA' ? 'LIMPIA' : 'PROCESO'}">${r.estado === 'COMPLETA' ? 'Completa' : 'Sin foto después'}</span></div>
      <p class="muted" style="margin:4px 0 0">${esc(r.operador)} · Turno ${r.turno === 'DIA' ? 'Día' : 'Noche'} · ${esc(r.horaAntes)}${r.horaDespues ? ' a ' + esc(r.horaDespues) + (r.minutos ? ' (' + esc(r.minutos) + ' min)' : '') : ''}</p>
      <div class="fotos">
        ${r.antes ? `<a href="${esc(r.verAntes)}" target="_blank" rel="noopener"><img src="${esc(r.antes)}" loading="lazy" referrerpolicy="no-referrer" alt=""><span>ANTES ${esc(r.horaAntes)}</span></a>` : '<div class="vacio">Sin foto</div>'}
        ${r.despues ? `<a href="${esc(r.verDespues)}" target="_blank" rel="noopener"><img src="${esc(r.despues)}" loading="lazy" referrerpolicy="no-referrer" alt=""><span>DESPUÉS ${esc(r.horaDespues)}</span></a>` : '<div class="vacio">Pendiente</div>'}
      </div></div>`).join('')}</div>`
    : '<div class="card muted">No hay registros para este filtro.</div>');
}

/* ====== CÓDIGOS QR ====== */
function vQR(){
  return `<div class="card row"><div><h2 style="margin:0">Códigos QR por zona</h2>
      <p class="muted" style="margin:4px 0 0">Cada código abre la página del operador con la zona seleccionada. Marque los que desea imprimir.</p></div>
      <button class="btn" id="bImp">Imprimir seleccionados</button></div>
    <div class="qrs">${D.zonas.map((z, i) => `<div class="qrc"><b>${esc(z)}</b><div class="q" id="qr${i}"></div>
      <label><input type="checkbox" class="sel" data-i="${i}" checked> Imprimir</label></div>`).join('')}</div>
    <p class="muted">Dirección usada: ${esc(URL_OPERADOR)}</p>`;
}
const urlZona = z => URL_OPERADOR + '?z=' + encodeURIComponent(z);
function pintarQR(){
  if(!window.QRCode){ $('#app').insertAdjacentHTML('afterbegin', '<div class="card err">No se pudo cargar el generador de QR. Revise su conexión.</div>'); return; }
  D.zonas.forEach((z, i) => new QRCode(document.getElementById('qr' + i), {text: urlZona(z), width: 170, height: 170, correctLevel: QRCode.CorrectLevel.M}));
  $('#bImp').onclick = imprimir;
}
function imprimir(){
  const sel = Array.from(document.querySelectorAll('.sel')).filter(c => c.checked).map(c => D.zonas[Number(c.dataset.i)]);
  if(!sel.length) return alert('Seleccione al menos una zona.');
  $('#print').innerHTML = sel.map((z, i) => `<div class="hoja"><div class="t">CONTROL DE LIMPIEZA · BODEGA DE SILOS</div>
      <div class="z">${esc(z)}</div><div class="q" id="pq${i}"></div>
      <ol><li>Escanee este código con el celular.</li><li>Tome la foto ANTES de limpiar.</li><li>Realice la limpieza completa de la zona.</li><li>Tome la foto DESPUÉS desde el mismo punto.</li></ol>
      <div class="pie">Responsable: operador de turno</div></div>`).join('');
  sel.forEach((z, i) => new QRCode(document.getElementById('pq' + i), {text: urlZona(z), width: 230, height: 230, correctLevel: QRCode.CorrectLevel.M}));
  setTimeout(() => window.print(), 600);
}

$('#bAct').onclick = () => clave && cargar();
$('#bSalir').onclick = () => { clave = null; ls('jefe_clave', null); login(); };
if(clave) cargar(); else login();
</script>
</body>
</html>
